<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumtu Garden International Academy</title>
    
    <!-- Google Fonts Link အမှန် ပြင်ဆင်ထားပါသည် -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px;
            margin: 0;
        }

        /* 
           မှတ်ချက် - navbar.html ထဲတွင် <style> ထည့်ထားပြီးဖြစ်ပါက 
           ဤနေရာရှိ Nav Bar CSS များကို ဖျက်ပစ်နိုင်ပါသည်။
        */
        .navbar {
            background-color: #ffffff; 
            padding: 10px 40px;
            margin: -50px -50px 50px -50px;
            width: calc(100% + 100px); /* + ဘေးဘယ်ညာတွင် Space ပါရပါမည် */
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.05); 
        }
        .nav-left { display: flex; align-items: center; }
        .logo { height: 90px; width: auto; margin-right: 30px; }
        .nav-links { display: flex; align-items: center; }
        .nav-links a, .nav-auth a { color: #1e3d59; text-decoration: none; padding: 10px 15px; font-size: 15px; font-weight: 600; }
        .nav-links a:hover, .nav-auth a:hover { color: #ff6e40; }
        .search-box { padding: 8px 15px; font-size: 14px; border: 1px solid #ddd; border-radius: 20px; margin-right: 15px; outline: none; }
        .nav-auth { display: flex; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: #ffffff; min-width: 750px; box-shadow: 0px 8px 24px rgba(0,0,0,0.15); border-radius: 8px; padding: 20px; z-index: 1000; top: 100%; left: 0; justify-content: space-between; text-align: left; }
        .dropdown:hover .dropdown-content { display: flex; }
        .course-group { flex: 1; padding: 0 15px; }
        .course-group:not(:last-child) { border-right: 1px solid #eee; }
        .course-group h3 { font-size: 14px; color: #9e1c22; margin-top: 0; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .course-group p { font-size: 13px; color: #666; margin: 5px 0 12px 0; font-weight: normal; }
        .course-level { display: block; padding: 8px 12px; color: #1e3d59 !important; font-size: 14px; font-weight: 500; text-decoration: none; border-radius: 4px; margin-bottom: 5px; transition: background 0.2s; }
        .course-level:hover { background-color: #f4f7f6; color: #ff6e40 !important; }

        .hero-section {
            margin-top: 80px;
            margin-bottom: 40px;
        }
        .btn {
            background-color: #9e1c22; 
            color: white;
            padding: 14px 35px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            font-weight: 600;
            box-shadow: 0px 4px 15px rgba(158, 28, 34, 0.3);
            transition: background 0.3s, transform 0.2s;
        }
        .btn:hover { 
            background-color: #7a1519; 
            transform: translateY(-2px); /* Hover လုပ်လျှင် ခလုတ်လေး အပေါ်ကြွတက်သည့် Effect */
        }
    </style>
</head>
<body>

    <!-- navbar.html ကို အလိုအလျောက် ဆွဲခေါ်မည့် နေရာအမှန် -->
    <div id="navbar-container"></div>
    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            })
            .catch(error => console.error('Error loading navbar:', error)); /* Error ပေါ်လျှင် သိနိုင်ရန် */
    </script>

    <!-- မူလစာမျက်နှာ၏ အဓိက ကြိုဆိုရေးစာသား -->
    <div class="hero-section">
        <h1 style="margin-bottom: 0px; color: #1e3d59; font-weight: 700; text-transform: uppercase;">SUMTU GARDEN</h1>
        <h2 style="margin-top: -5px; color: #333; font-weight: 600;">International Academy</h2>
        <p style="font-size: 22px; color: #9e1c22; font-weight: 700; margin-top: 15px;">
            Want to Achieve a Higher Band Score? Come and Join Us!
        </p>
        <a href="#" class="btn">Enroll Now (သင်တန်းအပ်ရန်)</a>
    </div>

    <!-- အဓိက သင်တန်းများပြသသည့် ကတ်ပြားလေး -->
    <div style="margin-top: 50px; background: white; padding: 30px; border-radius: 15px; max-width: 550px; margin-left: auto; margin-right: auto; box-shadow: 0px 4px 20px rgba(0,0,0,0.05);">
        <h2 style="color: #1e3d59; margin-top: 0px; font-weight: 700;">Our Popular Courses</h2>
        <ul style="text-align: left; font-size: 16px; line-height: 2.2; padding-left: 40px; color: #555;">
            <li>📖 <b>IELTS Masterclass</b> (4 Months)</li>
            <li>🗣️ <b>General English & Speaking</b> (3 Months)</li>
            <li>📝 <b>Academic Writing</b> (2 Months)</li>
        </ul>
    </div>

</body>
</html>
